[package]
name = "rust_lib_vnt_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[target.x86_64-pc-windows-msvc.build-dependencies]
thunk-rs = { version = "0.3.3", features = ["win7"] }

[target.i686-pc-windows-msvc.build-dependencies]
thunk-rs = { version = "0.3.3", features = ["win7"] }

[dependencies]

serde = { version = "1.0", features = ["derive"] }
flutter_rust_bridge = "=2.1.0"
vnt-core = { path = "../vendor/vnt-core-2.0.10" }
anyhow = "1.0.82"
tokio = { version = "1.37.0", features = ["full"] }
# 与 vendor/vnt-core-2.0.10 依赖的 rustp2p-core 修订保持一致
rustp2p-core = { git = "https://github.com/rustp2p/rustp2p", rev = "04a3e26ba19d9ed08b5addb74c00a23e7a2b7933" }
ipnet = "2.11"
serde_json = "1.0"

log = "0.4.17"
log4rs = "=1.2.0"

