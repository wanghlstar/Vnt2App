[package]
name = "vnt-core"
version = "2.0.10"
edition = "2024"
license = "Apache-2.0"

[features]
internal-bench = []

[dependencies]

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

tun-rs = { version = "2", features = ["async", "async_framed"] }

# 与上游 vnt 2.0.10 Cargo.lock 锁定的 rustp2p-core 修订保持一致
rustp2p-core = { git = "https://github.com/rustp2p/rustp2p", rev = "04a3e26ba19d9ed08b5addb74c00a23e7a2b7933" }
tcp_ip = "0.2"

anyhow = "1"
parking_lot = "0.12"
arc-swap = "1.7"

quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-tokio"] }

tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
hex = "0.4"
sha2 = "0.11"
rustls-native-certs = "0.8.2"
log = "0.4"
bytes = "1.11.0"
rand = "0.10"
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }
pnet_packet = "0.35"
pnet_base = "0.35"
ring = "0.17.14"
subtle = "2.6"
zerocopy = { version = "0.8.31", features = ["derive"] }
socket2 = { version = "0.6.1", features = ["all"] }

prost = "0.14"
tokio-tungstenite = "0.30"
tungstenite = "0.30"
uuid = { version = "1.18.1", features = ["v4"] }
ipnet = { version = "2.11", features = ["serde"] }
getifaddrs = "0.6.0"
dns-parser = "0.8"

lz4_flex = "0.14"
reed-solomon-erasure = "6.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
base64 = "0.22"
rcgen = "0.14.6"

# route_manager 与 machine-uid 均只支持桌面平台；
# machine-uid 在 iOS/tvOS 上无对应实现会编译失败，移动端走 device_id 文件兜底
# （与 src/utils/device_id.rs 的 cfg 保持一致）
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "tvos")))'.dependencies]
route_manager = "0.2"
machine-uid = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winreg"] }
widestring = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# reqwest's platform verifier needs an Android Context and companion JVM classes.
# vnt-core is also embedded by vnt-jni, so use bundled WebPKI roots for its
# dynamic server-list HTTPS requests instead of relying on host initialization.
webpki-roots = "1"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[target.x86_64-pc-windows-msvc.build-dependencies]
thunk-rs = { version = "0.3.3", features = ["win7"] }

[target.i686-pc-windows-msvc.build-dependencies]
thunk-rs = { version = "0.3.3", features = ["win7"] }
